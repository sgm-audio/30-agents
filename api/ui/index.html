<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #0b100e;
    --bg1: #121a16;
    --ink: #e7eee8;
    --muted: #8f9f94;
    --line: #24312a;
    --accent: #d4a574;
    --accent-2: #7ec8a3;
    --danger: #e85d5d;
    --warn: #e6b84d;
    --user: #1e3a2f;
    --bot: #151e19;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Figtree", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #1a2a22 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #2a2218 0%, transparent 50%),
      var(--bg0);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg1) 85%, transparent);
    backdrop-filter: blur(10px);
  }
  .brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.55rem;
    letter-spacing: -0.02em;
    color: var(--accent);
    line-height: 1;
  }
  .brand span { color: var(--ink); font-weight: 600; }
  .health {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .pill {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg1);
    color: var(--muted);
  }
  .pill.on { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 40%, var(--line)); }
  .pill.off { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  @media (min-width: 960px) {
    main { grid-template-columns: 320px minmax(0, 1fr); }
  }

  aside {
    display: none;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg1) 70%, transparent);
    padding: 1.25rem;
    overflow: auto;
  }
  @media (min-width: 960px) { aside { display: block; } }
  aside h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .group {
    margin-bottom: 1rem;
  }
  .group-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.4rem;
    padding-left: 0.25rem;
  }
  .action {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.4rem;
    cursor: pointer;
    font: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .action:hover {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    transform: translateY(-1px);
  }
  .action strong { display: block; font-size: 0.88rem; margin-bottom: 0.15rem; }
  .action small { color: var(--muted); font-size: 0.75rem; line-height: 1.3; }
  .action.skeleton {
    pointer-events: none;
    opacity: 0.5;
    background: linear-gradient(90deg, var(--bg1) 25%, var(--line) 50%, var(--bg1) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .squads-section {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }

  .chat {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #messages {
    flex: 1;
    overflow: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .msg {
    max-width: min(720px, 92%);
    padding: 0.95rem 1.1rem;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    font-size: 0.95rem;
    animation: rise 0.28s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border: 1px solid color-mix(in srgb, var(--accent-2) 25%, var(--line));
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bot);
    border: 1px solid var(--line);
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    background: transparent;
    border: 0;
    font-size: 0.85rem;
    text-align: center;
  }
  .welcome {
    max-width: 640px;
    margin: 8vh auto 0;
    text-align: center;
    animation: rise 0.4s ease both;
  }
  .welcome h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(2rem, 4vw, 2.8rem);
    letter-spacing: -0.03em;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }
  .welcome p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 36ch;
    margin: 0 auto 1.4rem;
  }
  .starters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }
  .starter {
    border: 1px solid var(--line);
    background: var(--bg1);
    color: var(--ink);
    border-radius: 999px;
    padding: 0.55rem 0.95rem;
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .starter:hover { border-color: var(--accent); color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    padding: 0.9rem 1.1rem 1.1rem;
    background: color-mix(in srgb, var(--bg1) 90%, transparent);
  }
  .composer {
    display: flex;
    gap: 0.65rem;
    max-width: 900px;
    margin: 0 auto;
  }
  #task-input {
    flex: 1;
    resize: none;
    min-height: 52px;
    max-height: 160px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg0);
    color: var(--ink);
    padding: 0.9rem 1rem;
    font: inherit;
    font-size: 1rem;
  }
  #task-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    border: 0;
    border-radius: 14px;
    padding: 0 1.25rem;
    background: var(--accent);
    color: #0b100e;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    min-width: 96px;
  }
  #send-btn:hover { filter: brightness(1.06); }
  #send-btn:disabled { opacity: 0.45; cursor: default; filter: none; }
</style>
</head>
<body>
<header>
  <div class="brand">30 <span>Agents</span></div>
  <div class="health" id="health">
    <span class="pill" id="pill-api">API…</span>
    <span class="pill" id="pill-redis">Redis…</span>
    <span class="pill" id="pill-ollama">Ollama…</span>
    <span class="pill" id="pill-backend">Backend…</span>
  </div>
</header>

<main>
  <aside id="sidebar">
    <h2>Agents</h2>
    <div id="agent-groups"></div>
    <div class="squads-section">
      <h2>Squads</h2>
      <div id="squad-cards"></div>
    </div>
  </aside>

  <section class="chat">
    <div id="messages">
      <div class="welcome" id="welcome">
        <h1>30 Agents</h1>
        <p>Tell them what you need. Outreach, SEO, writing, code — one place.</p>
        <div class="starters">
          <button class="starter" data-task="Summarize what this system can do for my local business in 5 bullets">What can you do?</button>
          <button class="starter" data-task="Find Vancouver plumbers without websites">Find leads</button>
          <button class="starter" data-task="Draft a redesign pitch email for a dental clinic">Draft an email</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="composer">
    <textarea id="task-input" placeholder="Ask for leads, an SEO audit, an email, code help…" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</footer>

<script>
// ──────────────────────────────────────────────
// DataLoader — fetch + transform (pure where possible)
// ──────────────────────────────────────────────
const DataLoader = (function() {
  const CACHE_TTL = 5 * 60 * 1000; // 5 min
  const CACHE_KEY = 'agents_squads_cache';

  function getCached() {
    try {
      const raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const { ts, data } = JSON.parse(raw);
      if (Date.now() - ts > CACHE_TTL) return null;
      return data;
    } catch { return null; }
  }

  function setCache(data) {
    try {
      sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
    } catch {}
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (res.status === 503) throw new Error('DEGRADED');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // Pure function: Agent[] → Record<string, Agent[]>
  function groupAgents(agents) {
    const groups = {
      'Orchestration': [],
      'Research & Knowledge': [],
      'Code & Engineering': [],
      'Writing & Content': [],
      'Analysis & Decisions': [],
      'Vision & Media': [],
      'Outreach Pipeline': [],
      'SEO & Design': [],
      'Other': []
    };

    const nameToGroup = {
      // Orchestration
      'orchestrator': 'Orchestration',
      'memory_manager': 'Orchestration',
      'context_tracker': 'Orchestration',
      'tool_dispatcher': 'Orchestration',
      'state_machine': 'Orchestration',
      // Research & Knowledge
      'web_researcher': 'Research & Knowledge',
      'doc_reader': 'Research & Knowledge',
      'knowledge_synthesizer': 'Research & Knowledge',
      'fact_verifier': 'Research & Knowledge',
      'knowledge_base': 'Research & Knowledge',
      'semantic_searcher': 'Research & Knowledge',
      // Code & Engineering
      'code_writer': 'Code & Engineering',
      'code_reviewer': 'Code & Engineering',
      'bug_hunter': 'Code & Engineering',
      'system_architect': 'Code & Engineering',
      'test_engineer': 'Code & Engineering',
      // Writing & Content
      'writer': 'Writing & Content',
      'summarizer': 'Writing & Content',
      'translator': 'Writing & Content',
      'editor': 'Writing & Content',
      'content_strategist': 'Writing & Content',
      // Analysis & Decisions
      'data_analyst': 'Analysis & Decisions',
      'logic_engine': 'Analysis & Decisions',
      'planner': 'Analysis & Decisions',
      'critic': 'Analysis & Decisions',
      'decision_engine': 'Analysis & Decisions',
      'methodology_advisor': 'Analysis & Decisions',
      // Vision & Media
      'vision_analyst': 'Vision & Media',
      'embedding_engine': 'Vision & Media',
      'multimodal_synthesizer': 'Vision & Media',
      'media_coordinator': 'Vision & Media',
      'audio_analyst': 'Vision & Media',
      // Outreach Pipeline
      'lead_scout': 'Outreach Pipeline',
      'email_finder': 'Outreach Pipeline',
      'outreach_writer': 'Outreach Pipeline',
      // SEO & Design
      'web_design_concept': 'SEO & Design',
      'on_page_seo': 'SEO & Design',
      'technical_seo': 'SEO & Design',
      'content_seo': 'SEO & Design',
      'backlink_agent': 'SEO & Design',
    };

    for (const a of agents) {
      const group = nameToGroup[a.name] || 'Other';
      groups[group].push(a);
    }

    // Remove empty groups
    return Object.fromEntries(Object.entries(groups).filter(([, v]) => v.length > 0));
  }

  async function loadAll() {
    const cached = getCached();
    if (cached) return cached;

    const [agents, squads] = await Promise.all([
      fetchJson('/api/agents'),
      fetchJson('/api/squads')
    ]);

    const data = { agents, squads, groups: groupAgents(agents) };
    setCache(data);
    return data;
  }

  return { loadAll, groupAgents };
})();

// ──────────────────────────────────────────────
// Renderer — DOM construction only
// ──────────────────────────────────────────────
const Renderer = (function() {
  function skeletonAction() {
    const btn = document.createElement('button');
    btn.className = 'action skeleton';
    btn.innerHTML = '<strong>    </strong><br><small>       </small>';
    return btn;
  }

  function makeAction(agent) {
    const btn = document.createElement('button');
    btn.className = 'action';
    btn.dataset.task = agent.name; // clicking agent name → sendTask(agent.name)
    btn.innerHTML = `<strong>${agent.name.replace(/_/g, ' ')}</strong><small>${agent.description || 'No description'}</small>`;
    return btn;
  }

  function makeSquadCard(squad) {
    const btn = document.createElement('button');
    btn.className = 'action';
    // Squad task template — user can edit before sending
    const defaultTask = squad.config?.default_task || `Run the ${squad.display_name || squad.name} squad`;
    btn.dataset.task = defaultTask;
    btn.innerHTML = `<strong>${squad.display_name || squad.name}</strong><small>${squad.description || squad.config?.description || 'Pipeline workflow'}</small>`;
    return btn;
  }

  function renderGroups(groups, container) {
    container.innerHTML = '';
    for (const [groupName, agents] of Object.entries(groups)) {
      const section = document.createElement('div');
      section.className = 'group';
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = groupName;
      section.appendChild(label);
      for (const agent of agents) {
        section.appendChild(makeAction(agent));
      }
      container.appendChild(section);
    }
    // Empty state
    if (Object.keys(groups).length === 0) {
      const msg = document.createElement('div');
      msg.className = 'action';
      msg.style.opacity = '0.6';
      msg.textContent = 'No agents loaded — check API health';
      container.appendChild(msg);
    }
  }

  function renderSquads(squads, container) {
    container.innerHTML = '';
    const list = squads || Object.values(window.ALL_SQUADS || {});
    for (const squad of list) {
      container.appendChild(makeSquadCard(squad));
    }
    if (!list.length) {
      const msg = document.createElement('div');
      msg.className = 'action';
      msg.style.opacity = '0.6';
      msg.textContent = 'No squads loaded';
      container.appendChild(msg);
    }
  }

  function renderSkeletons(groupCount, squadCount) {
    const groupsContainer = document.getElementById('agent-groups');
    const squadsContainer = document.getElementById('squad-cards');
    groupsContainer.innerHTML = '';
    squadsContainer.innerHTML = '';
    for (let i = 0; i < groupCount; i++) {
      const section = document.createElement('div');
      section.className = 'group';
      section.innerHTML = '<div class="group-label">    </div>';
      for (let j = 0; j < 3; j++) section.appendChild(skeletonAction());
      groupsContainer.appendChild(section);
    }
    for (let i = 0; i < squadCount; i++) {
      squadsContainer.appendChild(skeletonAction());
    }
  }

  return { renderGroups, renderSquads, renderSkeletons };
})();

// ──────────────────────────────────────────────
// Controller — wiring clicks to existing sendTask
// ──────────────────────────────────────────────
const Controller = (function() {
  function bindClicks() {
    document.querySelectorAll('[data-task]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (typeof sendTask === 'function') sendTask(btn.dataset.task);
      });
    });
  }
  return { bindClicks };
})();

// ──────────────────────────────────────────────
// App bootstrap — existing chat/health logic preserved
// ──────────────────────────────────────────────
const sessionId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
let ws;
let busy = false;

function setPill(id, ok, label, warn=false) {
  const el = document.getElementById(id);
  el.textContent = label;
  el.className = 'pill ' + (warn ? 'warn' : ok ? 'on' : 'off');
}

async function refreshHealth() {
  try {
    const data = await fetch('/api/health').then(r => r.json());
    setPill('pill-api', true, 'API · online');
    setPill('pill-redis', !!data.redis, data.redis ? 'Redis · ok' : 'Redis · down');
    setPill('pill-ollama', !!data.ollama, data.ollama ? 'Ollama · ok' : 'Ollama · offline', !data.ollama);
    setPill('pill-backend', true, `LLM · ${(data.llm_backend || 'ollama').toUpperCase()}`);
  } catch {
    setPill('pill-api', false, 'API · offline');
    setPill('pill-redis', false, 'Redis · ?');
    setPill('pill-ollama', false, 'Ollama · ?');
    setPill('pill-backend', false, 'LLM · ?');
  }
}

let connectPromise = null;

async function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  if (connectPromise) return connectPromise;

  connectPromise = (async () => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let token = sessionStorage.getItem('api_secret') || '';
    if (!token) {
      token = window.prompt('Enter API_SECRET for this session') || '';
      if (token) sessionStorage.setItem('api_secret', token);
    }
    if (!token) {
      addMsg('API_SECRET required — refresh the page to enter it.', 'system');
      return;
    }
    try {
      const probe = await fetch('/api/agents', { headers: { 'X-API-Key': token } });
      if (probe.status === 401) {
        sessionStorage.removeItem('api_secret');
        addMsg('Invalid API_SECRET — refresh to retry.', 'system');
        return;
      }
      if (probe.status === 503) {
        addMsg('Server API_SECRET not configured — retrying…', 'system');
        setTimeout(() => { connectPromise = null; connect(); }, 5000);
        return;
      }
    } catch {
      setTimeout(() => { connectPromise = null; connect(); }, 2500);
      return;
    }
    const q = `?token=${encodeURIComponent(token)}`;
    await new Promise((resolve) => {
      let settled = false;
      const done = () => { if (!settled) { settled = true; resolve(); } };
      ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}${q}`);
      ws.onopen = () => { refreshHealth(); done(); };
      ws.onclose = () => { connectPromise = null; done(); setTimeout(connect, 2500); };
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'result') {
          const nodes = [...document.querySelectorAll('.msg.system')];
          const last = nodes[nodes.length - 1];
          if (last && last.dataset.temp === '1') last.remove();
          addMsg(data.result || '(empty response)', 'assistant');
          setBusy(false);
        } else if (data.type === 'error') {
          addMsg(data.error || 'Something went wrong', 'system');
          setBusy(false);
        }
      };
    });
  })().finally(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) connectPromise = null;
  });

  return connectPromise;
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addMsg(text, type) {
  hideWelcome();
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  const box = document.getElementById('messages');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function setBusy(v) {
  busy = v;
  document.getElementById('send-btn').disabled = v;
}

async function sendTask(task) {
  task = (task || '').trim();
  if (!task || busy) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addMsg('Not connected yet — retrying…', 'system');
    await connect();
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
  }
  addMsg(task, 'user');
  const tip = addMsg('Working on it…', 'system');
  tip.dataset.temp = '1';
  setBusy(true);
  ws.send(JSON.stringify({ task }));
  document.getElementById('task-input').value = '';
}

// ──────────────────────────────────────────────
// Load agents/squads → render sidebar
// ──────────────────────────────────────────────
async function initSidebar() {
  Renderer.renderSkeletons(8, 6);
  try {
    const { groups, squads } = await DataLoader.loadAll();
    Renderer.renderGroups(groups, document.getElementById('agent-groups'));
    Renderer.renderSquads(squads, document.getElementById('squad-cards'));
    Controller.bindClicks();
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      sessionStorage.removeItem('api_secret');
      addMsg('Session expired — refresh to re-enter API_SECRET.', 'system');
    } else if (e.message === 'DEGRADED') {
      addMsg('Server running in degraded mode (API_SECRET not set).', 'system');
      Renderer.renderGroups({}, document.getElementById('agent-groups'));
      Renderer.renderSquads([], document.getElementById('squad-cards'));
    } else {
      addMsg('Failed to load agents/squads — check connection.', 'system');
      Renderer.renderGroups({}, document.getElementById('agent-groups'));
      Renderer.renderSquads([], document.getElementById('squad-cards'));
    }
  }
}

document.getElementById('send-btn').addEventListener('click', () => {
  sendTask(document.getElementById('task-input').value);
});
document.getElementById('task-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendTask(document.getElementById('task-input').value);
  }
});
document.querySelectorAll('.starter').forEach(btn => {
  btn.addEventListener('click', () => sendTask(btn.dataset.task));
});

refreshHealth();
setInterval(refreshHealth, 8000);
connect();
initSidebar();
</script>
</body>
</html>
