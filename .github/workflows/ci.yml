name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-import full app
        run: python -c "import api.server, main; print('app imports OK')"

      - name: Ensure .env not tracked by git
        run: git ls-files | grep -q "^\.env$" && exit 1 || exit 0

      - name: Assert 40 agents registered
        run: python -c "from agents.registry import ALL_AGENTS; assert len(ALL_AGENTS)==40"

      - name: Auth smoke (py_compile server.py)
        run: python -m py_compile api/server.py

      - name: Run tests
        run: pytest -q
